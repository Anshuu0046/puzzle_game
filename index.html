<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#ffe1ee" />
    <title>Sugar Bloom</title>
    <meta
      name="description"
      content="Sugar Bloom is a sweet match-3 puzzle game: swap glossy candies, build blasters and bombs, and bring three candy gardens into bloom."
    />
    <meta property="og:title" content="Sugar Bloom" />
    <meta property="og:description" content="A sweet match-3 garden adventure." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="icons/icon-512.png" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Sugar Bloom" />
  </head>
  <body>
    <div id="stage" hidden></div>
    <header id="hud" class="hud" hidden></header>
    <main id="screens"></main>
    <div id="boot-error" class="boot-error" role="alert" hidden>
      <p>Sugar Bloom couldn't start on this device. Please try a recent version of Chrome, Safari, Firefox or Edge.</p>
    </div>
    <noscript><p class="boot-error">Sugar Bloom needs JavaScript to play.</p></noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
